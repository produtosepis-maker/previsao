<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo - INMET</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #333333;
            --text-secondary: #666666;
            --primary-color: #2a5298;
            --accent-color: #00c6ff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 30px;
            backdrop-filter: blur(10px);
            margin: 20px 0;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Estado de Carregamento e Erro */
        .status-box {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            background-color: #ffe6e6;
            color: #d9534f;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #d9534f;
            margin-bottom: 20px;
            text-align: left;
        }

        .error-msg h3 {
            margin-bottom: 8px;
        }

        /* Abas de Dias da Previsão */
        .days-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 25px;
            scrollbar-width: thin;
        }

        .day-tab {
            background: #e2e8f0;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .day-tab:hover {
            background: #cbd5e1;
        }

        .day-tab.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
        }

        /* Detalhes da Previsão Selecionada */
        .forecast-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .forecast-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .date-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .periods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .period-card {
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .period-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }

        .period-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .period-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .info-label {
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-value {
            text-align: right;
            font-weight: 600;
            color: var(--text-color);
            max-width: 60%;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-cloud-sun-rain"></i> Previsão do Tempo - INMET</h1>
            <p id="location-subtitle">Carregando dados da localidade...</p>
        </header>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="status-box">
            <div class="spinner"></div>
            <p>Buscando informações meteorológicas na API...</p>
        </div>

        <!-- Mensagem de Erro -->
        <div id="error-container" style="display: none;"></div>

        <!-- Painel Principal de Dados -->
        <div id="weather-data" style="display: none;">
            <!-- Abas com os Dias -->
            <div class="days-tabs" id="days-tabs"></div>

            <!-- Conteúdo dos Dias -->
            <div id="days-content-container"></div>
        </div>
    </div>
